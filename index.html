<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación | Feria Educativa y Productiva</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Una invitación especial">
    <meta property="og:description" content="Te invitamos a ser parte de la Apertura de la Feria Educativa y Productiva.">
    <meta property="og:image" content="https://TU-DOMINIO.com/assets/img/preview-invitacion.jpg">
    <meta property="og:url" content="https://TU-DOMINIO.com/">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter y otras plataformas -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Una invitación especial">
    <meta name="twitter:description" content="Apertura de la Feria Educativa y Productiva">
    <meta name="twitter:image" content="https://TU-DOMINIO.com/assets/img/preview-invitacion.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="scene">

        <div class="envelope-wrapper" id="envelopeWrapper">

            <div class="envelope">
                
                <div class="envelope-back"></div>
                
                <!-- Decoración superior derecha -->
                <img src="assets/img/flores1.png" class="decoracion flor-superior" alt="Flores decorativas">

                <!-- Decoración inferior izquierda -->
                <img src="assets/img/flor2.png" class="decoracion flor-inferior" alt="Flores decorativas">
                
                <!-- Parte trasera -->
                <!-- Carta interior -->
                <div class="letter">
                    <div class="letter-content">
                        <span class="letter-title">Una invitación especial</span>
                        <span class="letter-subtitle">
                            Feria Educativa y Productiva
                        </span>
                    </div>
                </div>

                <!-- Pliegues laterales -->
                <div class="fold-left"></div>
                <div class="fold-right"></div>

                <!-- Pliegue inferior -->
                <div class="fold-bottom"></div>

                <!-- Solapa superior -->
                <div class="flap"></div>

                <button class="seal-button" id="sealButton" aria-label="Abrir invitación">
                    <img src="assets/img/sello.png" class="sello" alt="Sello">
                </button>
            </div>

        </div>

        <p class="scene-caption">Una experiencia especial te espera</p>

    </main>

    <!-- Audio de fondo de la invitación -->
  <audio id="bg-music" loop preload="auto">
    <source src="../assets/audio/musica-feria.mp3" type="audio/mpeg">
  </audio>

  <!-- Botón discreto para controlar la música -->
  <button type="button" id="music-toggle" class="music-btn" aria-label="Activar o pausar música">
    ♪ Música
  </button>

  <script src="script.js"></script>
</body>
</html>
